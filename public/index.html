<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sefira AI · Soporte IT</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat-app">
    <header class="chat-header">
      <div class="chat-header-info">
        <div class="logo-row">
          <span class="header-logo-wrap">
            <img class="header-logo" src="SefiraAI_logo.png" alt="Sefira AI" />
          </span>
          <span class="header-subtitle">Soporte IT</span>
        </div>
        <div class="status">
          <span class="status-dot"></span>
          <span>En línea</span>
        </div>
      </div>
      <div class="header-actions">
        <a href="/dashboard" class="dashboard-link" title="Dashboard de administrador" aria-label="Dashboard de administrador">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9"></rect>
            <rect x="14" y="3" width="7" height="5"></rect>
            <rect x="14" y="12" width="7" height="9"></rect>
            <rect x="3" y="16" width="7" height="5"></rect>
          </svg>
          <span>Dashboard Admin</span>
        </a>
        <button type="button" id="new-chat-btn" class="new-chat-btn" title="Nueva conversación" aria-label="Nueva conversación">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
            <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Nueva conversación</span>
        </button>
      </div>
    </header>

    <section id="chat-history" class="chat-history" aria-live="polite"></section>

    <form id="chat-form" class="chat-form">
      <input
        id="chat-input"
        type="text"
        placeholder="Escribí tu consulta..."
        autocomplete="off"
        required
      />
      <button type="submit" aria-label="Enviar mensaje">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
